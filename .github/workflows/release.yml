name: Build and publish desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate release tag policy
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const tag=process.env.GITHUB_REF_NAME; if (!/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-beta\.(?:0|[1-9]\d*))?$/.test(tag)) { console.error("Use vX.Y.Z for stable or vX.Y.Z-beta.N for beta releases."); process.exit(1); }'

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin Core update verification configuration
        env:
          SERVER_ROCK_AI_CORE_ORIGIN: ${{ vars.SERVER_ROCK_AI_CORE_ORIGIN }}
          SERVER_ROCK_UPDATE_PUBLIC_KEY_B64: ${{ vars.SERVER_ROCK_UPDATE_PUBLIC_KEY_B64 }}
        run: npm run configure-updates
      - name: Set package version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Server-Rock-AI-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
