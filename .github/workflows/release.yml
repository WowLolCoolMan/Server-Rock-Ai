name: Build and publish desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:syntax
      - run: npm run check:hygiene
      - run: npm test
      - run: npm run audit:ui
      - run: npm run audit:electron
      - name: Validate release tag policy
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const tag=process.env.GITHUB_REF_NAME; if (!/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-beta\.(?:0|[1-9]\d*))?$/.test(tag)) { console.error("Use vX.Y.Z for stable or vX.Y.Z-beta.N for beta releases."); process.exit(1); }'

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-repo-hygiene.cjs
      - run: node --check scripts/check-repo-hygiene.cjs
      - run: npm run audit:native-ui
      - run: dotnet restore native/ServerRock.Native.sln
      - run: dotnet run --project native/ServerRock.Core.Tests/ServerRock.Core.Tests.csproj --no-restore
      - run: dotnet build native/ServerRock.Native/ServerRock.Native.csproj --framework net10.0-desktop --no-restore

  release-readiness:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require production release gates
        env:
          NATIVE_MIGRATION_COMPLETE: ${{ vars.NATIVE_MIGRATION_COMPLETE }}
          RELEASE_SIGNING_READY: ${{ vars.RELEASE_SIGNING_READY }}
          PACKAGED_SMOKE_READY: ${{ vars.PACKAGED_SMOKE_READY }}
        run: |
          set -euo pipefail
          failed=0
          for gate in NATIVE_MIGRATION_COMPLETE RELEASE_SIGNING_READY PACKAGED_SMOKE_READY; do
            if [ "${!gate}" != "true" ]; then
              echo "Release gate ${gate} must be repository variable 'true' before a tag can publish." >&2
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Failing closed: no unsigned or pre-migration release will be published." >&2
            exit 1
          fi
      - name: Confirm signing credentials are available
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CERTIFICATE: ${{ secrets.CSC_LINK }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD MAC_APPLE_ID MAC_APP_PASSWORD MAC_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing signing secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Failing closed: signing credentials are not configured for every published desktop target." >&2
            exit 1
          fi

  package:
    needs: [test, native, release-readiness]
    if: ${{ always() && needs.test.result == 'success' && needs.native.result == 'success' && (needs.release-readiness.result == 'success' || needs.release-readiness.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set package version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Build signed desktop artifact
        env:
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Smoke test packaged Windows app
        if: matrix.platform == 'win' && matrix.arch == 'x64'
        shell: pwsh
        env:
          SERVER_ROCK_ELECTRON_EXECUTABLE: ${{ github.workspace }}\dist\win-unpacked\Server Rock AI.exe
        run: npm run audit:electron:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Server-Rock-AI-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
