name: Native app CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Native desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Electron 45 requires Node.js 22.12 or newer (release.yml already uses 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check repository hygiene
        run: node scripts/check-repo-hygiene.cjs

      - name: Verify hygiene check entry point
        run: node --check scripts/check-repo-hygiene.cjs

      - name: Restore native solution
        run: dotnet restore native/ServerRock.Native.sln

      - name: Run core checks
        run: dotnet run --project native/ServerRock.Core.Tests/ServerRock.Core.Tests.csproj --no-restore

      - name: Build shared Skia desktop target
        run: dotnet build native/ServerRock.Native/ServerRock.Native.csproj --framework net10.0-desktop --no-restore

      - name: Build Windows App SDK target
        if: runner.os == 'Windows'
        run: dotnet build native/ServerRock.Native/ServerRock.Native.csproj --framework net10.0-windows10.0.26100 --no-restore -p:RuntimeIdentifier=win-x64 -p:PublishProfile=
