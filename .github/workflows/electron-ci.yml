name: Electron replacement CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replacement-build:
    name: Electron replacement · build and protocol smoke
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Electron dependencies
        run: npm ci --prefix apps/desktop

      - name: Ensure Electron runtime payload
        run: node apps/desktop/node_modules/electron/install.js

      - name: Typecheck Electron renderer
        run: npm run desktop:typecheck

      - name: Audit Electron replacement boundary
        run: npm run audit:electron-runtime

      - name: Build Electron renderer
        run: npm run desktop:build

      - name: Stage packaged Electron artifact
        run: npm run package:electron

      - name: Smoke packaged Electron artifact
        run: npm run smoke:electron:artifact

      - name: Build persistent agent host
        run: npm run agent-host:build

      - name: Smoke replacement protocol
        run: npm run smoke:agent-host

      - name: Smoke bounded project browser
        run: npm run smoke:project-browser

      - name: Smoke bounded project terminal
        run: npm run smoke:project-terminal

      - name: Smoke reviewed project editor
        run: npm run smoke:project-editor

      - name: Smoke conversation search
        run: npm run smoke:conversation-search

      - name: Smoke conversation metadata
        run: npm run smoke:conversation-metadata

      - name: Smoke durable chat queue
        run: npm run smoke:chat-queue
