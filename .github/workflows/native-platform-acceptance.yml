name: Native platform acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: native-platform-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-runtime:
    name: Packaged runtime · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            executable: ServerRock.Native.exe
          - os: ubuntu-22.04
            rid: linux-x64
            executable: ServerRock.Native
          - os: ubuntu-24.04
            rid: linux-x64
            executable: ServerRock.Native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Publish exact packaged artifact
        shell: bash
        run: >-
          dotnet publish native/ServerRock.Native/ServerRock.Native.csproj
          -c Release -f net10.0-desktop -r ${{ matrix.rid }} -p:SelfContained=true
          -o "$RUNNER_TEMP/serverrock-acceptance"
      - name: Run packaged startup and window smoke
        shell: bash
        env:
          NATIVE_SMOKE_SECONDS: 12
          NATIVE_SMOKE_REQUIRE_WINDOW: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          executable="$RUNNER_TEMP/serverrock-acceptance/${{ matrix.executable }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --yes xvfb libx11-6 libxrandr2 libxi6 libfontconfig1 libdbus-1-3
            xvfb-run -a node scripts/smoke-native-artifact.cjs "$executable"
          else
            node scripts/smoke-native-artifact.cjs "$executable"
          fi
      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-platform-acceptance-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/serverrock-acceptance
          if-no-files-found: warn
          retention-days: 14
