name: Native desktop artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 portable archive
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained desktop app
        run: >-
          dotnet publish native/ServerRock.Native/ServerRock.Native.csproj
          -c Release -f net10.0-desktop -r win-x64 -p:SelfContained=true
          -o ${{ runner.temp }}/serverrock-ai-native/win-x64

      - name: Stage installer and rollback scripts
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'serverrock-ai-native\win-x64'
          New-Item -ItemType Directory -Force (Join-Path $publish 'packaging') | Out-Null
          Copy-Item packaging/native/setup.ps1,packaging/native/setup.sh,packaging/native/install.ps1,packaging/native/uninstall.ps1,packaging/native/rollback.ps1,packaging/native/README.md (Join-Path $publish 'packaging')
          Copy-Item packaging/native/release-manifest.json (Join-Path $publish 'release-manifest.json')

      - name: Smoke test the published Windows artifact
        env:
          NATIVE_SMOKE_SECONDS: 8
        run: node scripts/smoke-native-artifact.cjs "${{ runner.temp }}/serverrock-ai-native/win-x64/ServerRock.Native.exe"

      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'serverrock-ai-native'
          $publish = Join-Path $root 'win-x64'
          Copy-Item 'docs/NATIVE_RELEASE_ACCEPTANCE.md' $publish
          @'
          Skai Desktop native Windows x64 build

          This is a self-contained portable build. Extract the archive and run packaging/setup.ps1 for a Start Menu install with rollback.
          Keep the user's app data outside this folder when replacing app files. Signing evidence is not included in this diagnostic workflow.
          See NATIVE_RELEASE_ACCEPTANCE.md in this archive for current limitations and verification status.
          '@ | Set-Content -Encoding utf8 (Join-Path $publish 'README-release.txt')
          $archive = Join-Path $root 'serverrock-ai-native-win-x64.zip'
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $archive
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$digest  $(Split-Path -Leaf $archive)" | Set-Content -Encoding ascii (Join-Path $root 'SHA256SUMS.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: serverrock-ai-native-win-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/serverrock-ai-native/serverrock-ai-native-win-x64.zip
            ${{ runner.temp }}/serverrock-ai-native/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  linux-portable:
    name: Linux x64 portable archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained desktop app
        run: >-
          dotnet publish native/ServerRock.Native/ServerRock.Native.csproj
          -c Release -f net10.0-desktop -r linux-x64 -p:SelfContained=true
          -o "$RUNNER_TEMP/serverrock-ai-native/linux-x64"

      - name: Stage matching setup tools
        shell: bash
        run: |
          publish="$RUNNER_TEMP/serverrock-ai-native/linux-x64"
          mkdir -p "$publish/packaging"
          cp packaging/native/setup.sh packaging/native/setup.ps1 packaging/native/README.md "$publish/packaging/"
          cp packaging/native/release-manifest.json "$publish/release-manifest.json"

      - name: Smoke test the published Linux artifact
        env:
          NATIVE_SMOKE_SECONDS: 8
        run: xvfb-run -a node scripts/smoke-native-artifact.cjs "$RUNNER_TEMP/serverrock-ai-native/linux-x64/ServerRock.Native"

      - name: Create portable archive and checksum
        shell: bash
        run: |
          root="$RUNNER_TEMP/serverrock-ai-native"
          publish="$root/linux-x64"
          cp docs/NATIVE_RELEASE_ACCEPTANCE.md "$publish/"
          cat > "$publish/README-release.txt" <<'EOF'
          Skai Desktop native Linux x64 build

          This is a self-contained portable build. Extract the archive and run packaging/setup.sh for a desktop-menu install, or launch ServerRock.Native directly.
          The app still requires native desktop libraries from the host OS. See NATIVE_RELEASE_ACCEPTANCE.md in this archive for the current dependency list and limitations.
          Linux package-manager installers remain distro-specific; the archive includes the release packaging contract and data-retention rules.
          EOF
          chmod +x "$publish/ServerRock.Native"
          archive="$root/serverrock-ai-native-linux-x64.tar.gz"
          tar -czf "$archive" -C "$publish" .
          (cd "$root" && sha256sum "$(basename "$archive")" > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: serverrock-ai-native-linux-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/serverrock-ai-native/serverrock-ai-native-linux-x64.tar.gz
            ${{ runner.temp }}/serverrock-ai-native/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
