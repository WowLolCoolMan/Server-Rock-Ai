name: Build native desktop release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify native source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run check:hygiene
      - run: npm run check:release-config
      - run: npm run audit:native-ui
      - run: dotnet restore native/ServerRock.Native.sln
      - run: npm test -- --no-restore
      - run: dotnet build native/ServerRock.Native/ServerRock.Native.csproj --framework net10.0-desktop -c Release --no-restore

  package:
    name: Package native ${{ matrix.rid }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            executable: ServerRock.Native.exe
          - os: ubuntu-24.04
            rid: linux-x64
            executable: ServerRock.Native
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_SIGNING_READY: ${{ vars.RELEASE_SIGNING_READY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Publish self-contained native app
        shell: bash
        run: >-
          dotnet publish native/ServerRock.Native/ServerRock.Native.csproj
          -c Release -f net10.0-desktop -r ${{ matrix.rid }} -p:SelfContained=true
          -o "$RUNNER_TEMP/serverrock-native/${{ matrix.rid }}"
      - name: Stage versioned installer and rollback scripts
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          publish="$RUNNER_TEMP/serverrock-native/${{ matrix.rid }}"
          mkdir -p "$publish/packaging"
          cp packaging/native/setup.ps1 packaging/native/setup.sh packaging/native/install.ps1 packaging/native/uninstall.ps1 packaging/native/rollback.ps1 packaging/native/README.md "$publish/packaging/"
          version="${RELEASE_VERSION#v}"
          sed "s/\"version\": \"0.0.0\"/\"version\": \"$version\"/" packaging/native/release-manifest.json > "$publish/release-manifest.json"
      - name: Smoke-test exact published artifact
        shell: bash
        env:
          NATIVE_SMOKE_SECONDS: 8
        run: |
          executable="$RUNNER_TEMP/serverrock-native/${{ matrix.rid }}/${{ matrix.executable }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install --yes xvfb
            xvfb-run -a node scripts/smoke-native-artifact.cjs "$executable"
          else
            NATIVE_SMOKE_REQUIRE_WINDOW=1 node scripts/smoke-native-artifact.cjs "$executable"
          fi
      - name: Run Windows interactive UI acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\native-ui-acceptance.ps1 -Executable "$env:RUNNER_TEMP\serverrock-native\win-x64\ServerRock.Native.exe"
      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.RELEASE_SIGNING_READY == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_TIMESTAMP_URL)) { throw 'Windows signing is enabled but certificate, password, or timestamp URL is missing.' }
          $publish = Join-Path $env:RUNNER_TEMP 'serverrock-native\win-x64'
          $cert = Join-Path $env:RUNNER_TEMP 'serverrock-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
          & $signtool.FullName sign /fd SHA256 /f $cert /p $env:WINDOWS_CODESIGN_CERT_PASSWORD /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL /td SHA256 (Join-Path $publish 'ServerRock.Native.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          Get-AuthenticodeSignature (Join-Path $publish 'ServerRock.Native.exe') | Format-List | Out-File -Encoding utf8 (Join-Path $publish 'SIGNATURES-win-x64.txt')
      - name: Require Windows signing evidence
        if: runner.os == 'Windows' && env.RELEASE_SIGNING_READY == 'true'
        shell: pwsh
        run: if (-not (Test-Path "$env:RUNNER_TEMP/serverrock-native/win-x64/SIGNATURES-win-x64.txt")) { throw 'Windows signing evidence was not produced.' }
      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'serverrock-native'
          $publish = Join-Path $root '${{ matrix.rid }}'
          Copy-Item 'docs/NATIVE_RELEASE_ACCEPTANCE.md' $publish
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath (Join-Path $root 'Skai-Desktop-native-win-x64.zip')
          if (Test-Path (Join-Path $publish 'SIGNATURES-win-x64.txt')) { Copy-Item (Join-Path $publish 'SIGNATURES-win-x64.txt') (Join-Path $root 'SIGNATURES-win-x64.txt') }
          (Get-FileHash -Algorithm SHA256 (Join-Path $root 'Skai-Desktop-native-win-x64.zip')).Hash.ToLowerInvariant() + '  Skai-Desktop-native-win-x64.zip' | Set-Content -Encoding ascii (Join-Path $root 'SHA256SUMS.txt')
      - name: Archive Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          root="$RUNNER_TEMP/serverrock-native"
          publish="$root/${{ matrix.rid }}"
          cp docs/NATIVE_RELEASE_ACCEPTANCE.md "$publish/"
          chmod +x "$publish/${{ matrix.executable }}"
          tar -czf "$root/Skai-Desktop-native-linux-x64.tar.gz" -C "$publish" .
          (cd "$root" && sha256sum Skai-Desktop-native-linux-x64.tar.gz > SHA256SUMS.txt)
      - name: Sign Linux archive
        if: runner.os == 'Linux' && env.RELEASE_SIGNING_READY == 'true'
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_GPG_PRIVATE_KEY" ]; then echo 'Linux signing is enabled but RELEASE_GPG_PRIVATE_KEY is missing.' >&2; exit 1; fi
          root="$RUNNER_TEMP/serverrock-native"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign --output "$root/Skai-Desktop-native-linux-x64.tar.gz.asc" "$root/Skai-Desktop-native-linux-x64.tar.gz"
          gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print "keyid=" $5; exit }' > "$root/SIGNATURES-linux-x64.txt"
          printf 'signature=Skai-Desktop-native-linux-x64.tar.gz.asc\n' >> "$root/SIGNATURES-linux-x64.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Skai-Desktop-native-${{ matrix.rid }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/serverrock-native/Skai-Desktop-native-*
            ${{ runner.temp }}/serverrock-native/SIGNATURES-*.txt
            ${{ runner.temp }}/serverrock-native/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require native release gates
        env:
          NATIVE_MIGRATION_COMPLETE: ${{ vars.NATIVE_MIGRATION_COMPLETE }}
          RELEASE_SIGNING_READY: ${{ vars.RELEASE_SIGNING_READY }}
          PACKAGED_SMOKE_READY: ${{ vars.PACKAGED_SMOKE_READY }}
        run: |
          set -euo pipefail
          for gate in NATIVE_MIGRATION_COMPLETE RELEASE_SIGNING_READY PACKAGED_SMOKE_READY; do
            if [ "${!gate}" != "true" ]; then
              echo "Release gate ${gate} must be repository variable 'true'." >&2
              exit 1
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Skai-Desktop-native-*
          merge-multiple: true
      - name: Generate release checksums
        run: find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Require signed artifact evidence
        run: |
          set -euo pipefail
          signatures=$(find release-assets -maxdepth 1 -type f -name 'SIGNATURES-*.txt' -size +0c -print)
          if [ -z "$signatures" ]; then
            echo "Release blocked: no per-artifact signing evidence was produced." >&2
            exit 1
          fi
          cat $signatures > release-assets/SIGNATURES.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
